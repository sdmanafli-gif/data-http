[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Do NOT set VITE_BASE_PATH here — Netlify serves from site root (/)

# Qəbz şəkilləri üçün qısa link: sayt/q/xxxx → Supabase fayl yeri «q»
[[redirects]]
  from = "/q/*"
  to = "https://amvzitdyxivhidgunmrx.supabase.co/storage/v1/object/public/q/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
